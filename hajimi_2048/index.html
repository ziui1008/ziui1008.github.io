<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f7f6" />
    <title>并格 2048</title>
    <meta name="description" content="一款精致、离线可玩的 2048 小游戏。" />
    <link rel="icon" href="assets/app-icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script defer src="src/random.js"></script>
    <script defer src="src/engine.js"></script>
    <script defer src="src/storage.js"></script>
    <script defer src="src/audio.js"></script>
    <script defer src="src/share.js"></script>
    <script defer src="src/app.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-cluster">
          <a class="brand" href="index.html" aria-label="并格 2048 首页">
            <img src="assets/app-icon.svg" alt="" width="40" height="40" />
            <span>
              <strong>并格</strong>
              <small>2048</small>
            </span>
          </a>
          <span class="brand-divider" aria-hidden="true"></span>
          <div class="studio-brand" aria-label="ZIUI Tech 工作室">
            <img src="assets/ziui-tech-logo.svg" alt="" width="34" height="34" />
            <span>
              <strong>ZIUI Tech</strong>
              <small>GAME SYSTEMS</small>
            </span>
          </div>
        </div>
        <div class="top-actions" aria-label="显示与声音">
          <button class="quiet-button" id="themeButton" type="button">主题：自动</button>
          <label class="sound-picker" for="soundSelect">
            <span>音效</span>
            <select id="soundSelect" aria-label="选择音效包">
              <option value="off">关闭</option>
              <option value="hajimi">哈基米</option>
              <option value="dagou">大狗</option>
            </select>
          </label>
        </div>
      </header>

      <main>
        <section class="game-heading" aria-labelledby="pageTitle">
          <div>
            <p class="eyebrow" id="modeEyebrow">经典模式</p>
            <h1 id="pageTitle">把相同数字，推到一起。</h1>
          </div>
          <div class="mode-switch" role="tablist" aria-label="游戏模式">
            <button id="classicTab" class="mode-tab is-active" type="button" role="tab" aria-selected="true" data-mode="classic">经典</button>
            <button id="dailyTab" class="mode-tab" type="button" role="tab" aria-selected="false" data-mode="daily">今日挑战</button>
          </div>
        </section>

        <div class="game-layout">
          <section class="play-column" aria-label="游戏棋盘与操作">
            <div class="score-strip" aria-label="分数">
              <div class="score-item">
                <span>分数</span>
                <strong id="scoreValue">0</strong>
                <i id="scoreDelta" aria-hidden="true"></i>
              </div>
              <div class="score-item">
                <span>最佳</span>
                <strong id="bestValue">0</strong>
              </div>
              <div class="board-actions">
                <button id="undoButton" class="action-button" type="button" disabled>撤销</button>
                <button id="newGameButton" class="action-button action-button--strong" type="button">新局</button>
              </div>
            </div>

            <div class="board-frame" id="boardFrame">
              <div
                class="board"
                id="board"
                role="application"
                aria-label="2048 棋盘，使用方向键、WASD 或滑动操作"
                aria-describedby="boardHint"
                tabindex="0"
              >
                <div class="grid-layer" aria-hidden="true">
                  <span></span><span></span><span></span><span></span>
                  <span></span><span></span><span></span><span></span>
                  <span></span><span></span><span></span><span></span>
                  <span></span><span></span><span></span><span></span>
                </div>
                <div class="tile-layer" id="tileLayer" aria-hidden="true"></div>
                <div class="echo-trace" aria-hidden="true"></div>
                <div class="board-result" id="boardResult" hidden>
                  <p id="resultKicker">本局结束</p>
                  <strong id="resultTitle">没有可移动的位置了</strong>
                  <div class="result-actions">
                    <button id="continueButton" class="action-button" type="button" hidden>继续</button>
                    <button id="resultNewButton" class="action-button action-button--strong" type="button">再来一局</button>
                  </div>
                </div>
              </div>
            </div>

            <p class="board-hint" id="boardHint">
              <span class="key-cluster" aria-hidden="true"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span>
              <span>方向键或滑动</span>
              <span class="hint-divider" aria-hidden="true"></span>
              <span>合成 2048</span>
            </p>
          </section>

          <aside class="data-rail" aria-label="本局信息">
            <section class="progress-section">
              <div class="section-heading">
                <div>
                  <span class="section-label">距离目标</span>
                  <strong id="progressLabel">2 / 2048</strong>
                </div>
                <span id="progressPercent">0%</span>
              </div>
              <div class="progress-track" aria-hidden="true"><i id="progressBar"></i></div>
              <div class="milestones" aria-hidden="true"><span>2</span><span>128</span><span>512</span><span>2048</span></div>
            </section>

            <section class="metrics-section" aria-labelledby="metricsTitle">
              <div class="section-heading section-heading--compact">
                <h2 id="metricsTitle">本局</h2>
                <span class="live-dot"><i></i><span id="statusValue">进行中</span></span>
              </div>
              <dl class="metrics-grid">
                <div><dt>移动</dt><dd id="moveValue">0</dd></div>
                <div><dt>用时</dt><dd id="timeValue">00:00</dd></div>
                <div><dt>最大数字</dt><dd id="maxValue">2</dd></div>
                <div><dt>合并次数</dt><dd id="mergeValue">0</dd></div>
              </dl>
            </section>

            <section class="replay-section" aria-labelledby="replayTitle">
              <div class="section-heading section-heading--compact">
                <div>
                  <span class="section-label">回响记录</span>
                  <h2 id="replayTitle">逐步回看</h2>
                </div>
                <span id="replayCounter">0 / 0</span>
              </div>
              <input id="replayRange" type="range" min="0" max="0" value="0" aria-label="回放进度" disabled />
              <div class="replay-actions">
                <button id="replayBack" type="button" disabled>上一步</button>
                <button id="replayToggle" class="replay-primary" type="button" disabled>开始回放</button>
                <button id="replayForward" type="button" disabled>下一步</button>
              </div>
            </section>

            <section class="record-section" aria-labelledby="recordTitle">
              <div>
                <span class="section-label">本机记录</span>
                <h2 id="recordTitle">最好的一局</h2>
              </div>
              <strong id="recordValue">0</strong>
              <button id="shareButton" class="text-button" type="button">生成成绩卡</button>
            </section>
          </aside>
        </div>
      </main>

      <footer>
        <span>数据只保存在这台设备</span>
        <button id="clearDataButton" type="button">清除数据</button>
      </footer>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

    <dialog id="confirmDialog" class="confirm-dialog">
      <form method="dialog">
        <span class="dialog-label">确认操作</span>
        <h2 id="dialogTitle">开始新游戏？</h2>
        <p id="dialogText">当前进度会被替换。</p>
        <div class="dialog-actions">
          <button value="cancel" class="action-button">取消</button>
          <button id="dialogConfirm" value="confirm" class="action-button action-button--strong">开始新局</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
